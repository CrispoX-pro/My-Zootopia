<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Animal Repository</title>

    <style>
        html {
            background-color: #ffe9e9;
        }

        body {
            font-family: 'Roboto', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-weight: 400;
            letter-spacing: 0;
            padding: 1rem;
            width: 900px;
            margin: auto;
            background-color: #ffe9e9;
        }

        h1 {
            text-align: center;
            font-size: 40pt;
            font-weight: normal;
            color: #444444;
        }

        .cards {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .cards__item {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 20px 40px -14px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            padding: 1.5rem;
            margin: 40px 0;
            transition: transform 0.2s ease;
        }

        .cards__item:hover {
            transform: translateY(-5px);
        }

        .card__title {
            color: #696969;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .card__text {
            font-size: 1rem;
            line-height: 2;
            color: #444444;
        }

        .card__text br {
            line-height: 2;
        }

    </style>

</head>

<body>

<h1>My Animal Repository</h1>

<ul class="cards">

    __REPLACE_ANIMALS_INFO__

</ul>

</body>

</html>
